name: App de escritorio (Windows)

on:
  # Se ejecuta al subir cambios de la app; el botón manual solo aparece cuando el workflow está en main
  push:
    branches: [feature/app-escritorio]
    paths: ['desktop/**', '.github/workflows/desktop-windows.yml']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm install

      - run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: AYP-Sistema-Windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
